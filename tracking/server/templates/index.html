<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Build Status</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #terminal { border: 1px solid #ccc; padding: 10px; max-height: 300px; overflow-y: auto; background: black; color: green; font-family: monospace; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Flask Build Status</h1>

    <!-- File Upload Form -->
    <h2>Upload a File</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <p id="uploadStatus"></p>

    <!-- Start Build Button -->
    <h2>Build Process</h2>
    <button onclick="startBuild()">Start Build</button>

    <!-- Graph Construction Form -->
    <h2>Construct Graph</h2>
    <form id="graphForm">
        <label>Index Name:</label>
        <input type="text" id="indexName" required><br><br>
        
        <label>Base File:</label>
        <input type="text" id="baseFile" required><br><br>

        <label>r (Neighborhood Size):</label>
        <input type="number" id="r" value="32"><br><br>

        <label>l_build (Construction Depth):</label>
        <input type="number" id="lBuild" value="50"><br><br>

        <label>alpha (Exponential Factor):</label>
        <input type="number" step="0.1" id="alpha" value="1.2"><br><br>

        <label>Saturate Graph:</label>
        <input type="checkbox" id="saturateGraph" checked><br><br>

        <button type="button" onclick="createGraph()">Create Graph</button>
    </form>
    <p id="graphStatus"></p>

    <!-- Query Index Form -->
    <h2>Query Index</h2>
    <form id="queryForm">
        <label>Index Path:</label>
        <input type="text" id="indexPath" required><br><br>

        <label>Query File:</label>
        <input type="text" id="queryFile" required><br><br>

        <label>l (Search Depth):</label>
        <input type="number" id="queryL" value="50"><br><br>

        <label>k (Top K Results):</label>
        <input type="number" id="queryK" value="10"><br><br>

        <button type="button" onclick="queryIndex()">Query Index</button>
    </form>
    <p id="queryStatus"></p>

    <!-- Terminal Output -->
    <div id="terminal"></div>

    <script>
        var socket = io.connect("http://localhost:5000");

        socket.on("terminal_output", function(data) {
            let statusDiv = document.getElementById("terminal");
            let newLog = document.createElement("p");
            newLog.innerText = data.status;

            if (data.status.startsWith("ERROR")) {
                newLog.classList.add("error"); // Highlight errors in red
            }

            statusDiv.appendChild(newLog);
            statusDiv.scrollTop = statusDiv.scrollHeight;  // Auto-scroll down
        });

        function startBuild() {
            fetch("/create_build")
                .then(response => response.text());
        }

        function uploadFile() {
            let fileInput = document.getElementById("fileInput");
            let file = fileInput.files[0];

            if (!file) {
                document.getElementById("uploadStatus").innerText = "Please select a file first!";
                return;
            }

            let formData = new FormData();
            formData.append("file", file);

            fetch("/upload", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("uploadStatus").innerText = data.message + " (Path: " + data.path + ")";
            })
            .catch(error => {
                document.getElementById("uploadStatus").innerText = "Error uploading file.";
            });
        }

        function createGraph() {
            let indexName = document.getElementById("indexName").value;
            let baseFile = document.getElementById("baseFile").value;
            let r = document.getElementById("r").value;
            let lBuild = document.getElementById("lBuild").value;
            let alpha = document.getElementById("alpha").value;
            let saturateGraph = document.getElementById("saturateGraph").checked;

            if (!indexName || !baseFile) {
                document.getElementById("graphStatus").innerText = "Index Name and Base File are required!";
                return;
            }

            let requestData = {
                index_name: indexName,
                base_file: baseFile,
                r: parseInt(r),
                l_build: parseInt(lBuild),
                alpha: parseFloat(alpha),
                saturate_graph: saturateGraph
            };

            fetch("/create_graph", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("graphStatus").innerText = "Error: " + data.error;
                } else {
                    document.getElementById("graphStatus").innerText = data.message;
                }
            })
            .catch(error => {
                document.getElementById("graphStatus").innerText = "Error creating graph.";
            });
        }

        function queryIndex() {
            let indexPath = document.getElementById("indexPath").value;
            let queryFile = document.getElementById("queryFile").value;
            let l = document.getElementById("queryL").value;
            let k = document.getElementById("queryK").value;

            if (!indexPath || !queryFile) {
                document.getElementById("queryStatus").innerText = "Index Path and Query File are required!";
                return;
            }

            let requestData = {
                index_name: indexPath,
                query_file: queryFile,
                l: parseInt(l),
                k: parseInt(k)
            };

            fetch("/query_index", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("queryStatus").innerText = "Error: " + data.error;
                } else {
                    document.getElementById("queryStatus").innerText = "Query successful! Results: " + JSON.stringify(data);
                }
            })
            .catch(error => {
                document.getElementById("queryStatus").innerText = "Error querying index.";
            });
        }
    </script>
</body>
</html>
